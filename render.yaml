services:
  # ── Python AI Service (FastAPI + Embeddings + RAG) ────────────
  - type: web
    name: sourcefintch-ai-service
    runtime: python
    plan: starter
    rootDir: ai-service
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: "1"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: QDRANT_COLLECTION_NAME
        value: sourcefinch_chunks
      - key: CORS_ORIGIN
        value: https://sourcefintch.vercel.app,https://*.vercel.app
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REPORT_GEMINI_API_KEY
        sync: false
      - key: REPORT_LLM_MODEL
        value: gemini-2.5-flash
      - key: QDRANT_URL
        value: https://1ffa6d2b-9049-483c-bfb0-20ab52326d39.australia-southeast1-0.gcp.cloud.qdrant.io
      - key: QDRANT_API_KEY
        sync: false
      - key: NODE_API_URL
        fromService:
          type: web
          name: sourcefintch-backend
          property: hostWithScheme
      - key: INTERNAL_API_SECRET
        value: bda7cdb388aae2a90b4e5b6316876a1c8c5ae59c5bc435c0abe8ba5df89eef34

  # ── Node.js Express Backend (API + Auth + Ingestion) ──────────
  - type: web
    name: sourcefintch-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://sourcefintch.vercel.app,https://*.vercel.app
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "24225"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: sourcefintch-ai-service
          property: hostWithScheme
      - key: INTERNAL_API_SECRET
        value: bda7cdb388aae2a90b4e5b6316876a1c8c5ae59c5bc435c0abe8ba5df89eef34
      - key: GITHUB_TOKEN
        sync: false